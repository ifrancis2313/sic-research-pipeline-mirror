name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test
        # The package uses a src/ layout. Source-backed adapter tests skip
        # themselves when their deliberately untracked Data/ fixtures are
        # absent from this public-safe clone.
        run: PYTHONPATH=src pytest -q

      - name: Audit dependencies
        run: pip-audit -r requirements.lock --progress-spinner=off
